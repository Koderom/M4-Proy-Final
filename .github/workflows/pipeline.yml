name: CI and Release with Gradle

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build-and-test
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Define application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag: $GITHUB_REF_NAME. Expected vMAJOR.MINOR.PATCH."
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.1-SNAPSHOT-${GITHUB_SHA::7}"
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, test, verify coverage and package
        run: ./gradlew clean build --no-daemon

      - name: Verify executable JAR
        shell: bash
        run: test -f "build/libs/m4-proy-final-${APP_VERSION}.jar"

      - name: Publish executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: m4-proy-final-${{ steps.version.outputs.value }}
          path: build/libs/m4-proy-final-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-artifact
          path: build/reports/tests/test/
          if-no-files-found: warn

      - name: Publish Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report-artifact
          path: build/reports/jacoco/test/
          if-no-files-found: warn

  release:
    name: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executable JAR from CI
        uses: actions/download-artifact@v8
        with:
          name: m4-proy-final-${{ needs.ci.outputs.app_version }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/m4-proy-final-${{ needs.ci.outputs.app_version }}.jar" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
