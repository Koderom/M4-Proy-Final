name: Java CI with Gradle

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      # Compilar y generar JAR sin ejecutar tests
      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      # Ejecutar pruebas
      - name: Run tests with Gradle
        run: ./gradlew test --no-daemon

      # Generar reporte de cobertura
      - name: Run Code Coverage with Gradle
        run: ./gradlew test jacocoTestReport --no-daemon

      # Publicar JAR
      - name: Publish JAR
        uses: actions/upload-artifact@v4
        with:
          name: webapi-artifact
          path: build/libs/*.jar

      # Publicar reporte de pruebas
      - name: Publish Test Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-artifact
          path: build/reports/tests/test/

      # Publicar reporte de cobertura
      - name: Publish Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-artifact
          path: build/reports/jacoco/test/