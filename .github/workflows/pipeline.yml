name: Primer Pipeline CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compilación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bienvenida al pipeline
        run: echo "¡Bienvenido al pipeline de CI/CD!"

      - name: Mostrar información del entorno
        run: |
          echo "================================"
          echo "      PRIMER PIPELINE CI"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "================================"

      - name: Mostrar fecha y hora
        run: date

      - name: Mostrar versión de Git
        run: git --version

      - name: Compilar el proyecto
        run: ./gradlew compileJava compileTestJava --no-daemon

  test:
    name: Pruebas
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ejecutar pruebas y generar cobertura
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Resultado de las pruebas
        run: |
          echo "========================================"
          echo "  RESULTADO DE LAS PRUEBAS: OK"
          echo "========================================"
          echo "Los tests pasaron correctamente:"
          echo "  $(grep -h -o 'tests="[0-9]*"' build/test-results/test/*.xml | sed 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}') tests ejecutados"
          echo "========================================"

      - name: Subir reporte de ejecución de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Subir reporte de cobertura de código
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/reports/jacoco/test/html
            build/reports/jacoco/test/jacocoTestReport.xml